# Runs lint, format check and the full test suite (including real Chromium browser tests) on every push to
# main and every pull request. No OpenAI key is used: AI calls in the tests are replaced with fixed answers.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # The project targets Windows (start_*.cmd launchers, taskkill-based run timeouts).
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1' # Korean messages in test output; Windows pipes default to a legacy code page
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Install Chromium for Playwright
        run: python -m playwright install chromium

      - name: Lint
        run: python -m ruff check .

      - name: Format check
        run: python -m ruff format --check .

      - name: Tests
        run: python -m pytest -p no:cacheprovider
